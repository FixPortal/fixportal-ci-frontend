<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FixPortal CI Dashboard — live build status, pull request progress, and package health across all repositories." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preload every IBM Plex weight the board declares (see the @font-face
         block in src/dashboard.css). Without this the fonts swap in after first
         paint, and the swap alone costs ~0.10 of cold-load CLS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-sans-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-sans-latin-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-sans-latin-600-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-sans-latin-700-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-latin-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/ibm-plex-mono-latin-600-normal.woff2" />
    <title>CI Dashboard</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: var(--app-bg, #f7f8fa);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
