name: CI

on:
  # Deliberately narrow: all-branch pushes fire a second full run on every PR commit.
  # Concurrency does not safely solve that because push and PR refs differ.
  # Regression signal: two runs with one head SHA, one push and one pull_request.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Caching is safe now that every dependency is public: there is no
          # private tarball a fork PR could restore from the default-branch cache
          # scope. (It was disabled while the dashboard depended on the private
          # @fixportal/design package.)
          cache: npm

      - name: Install
        # No registry credentials: every dependency resolves from public npm, so
        # this step works unchanged on a fork PR, where repository secrets are not
        # available.
        # --ignore-scripts: nothing in the dependency tree needs a lifecycle script
        # to build (esbuild ships its binary via optionalDependencies; Playwright
        # browsers are installed explicitly below), so no third-party install code
        # runs.
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Package licence files match the repository root
        # The published tarball carries its own LICENSE and NOTICE (npm packs only
        # the package directory, so the root copies never reach consumers, and
        # Apache-2.0 s4 requires recipients get both). They are copies, so this
        # fails the build if either drifts from the canonical root file.
        run: |
          cmp LICENSE packages/ci-frontend/LICENSE
          cmp NOTICE packages/ci-frontend/NOTICE

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Typecheck library
        run: npm run typecheck -w @fix-portal/ci-frontend

      - name: Gate library coverage
        run: npm run coverage -w @fix-portal/ci-frontend

      - name: Build library
        run: npm run build:lib

      - name: Build standalone app
        run: npm run build:app

  container-smoke:
    name: Production container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Exercise production nginx container
        run: npm run test:container

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Assert every job in this workflow is gated
        env:
          # Jobs deliberately outside the gate, by job id. Push-only publish and deploy
          # work belongs here; quality jobs never do.
          GATE_EXEMPT: docker
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

  # Required status check. Deliberately a pure aggregator of needs.*.result: it decides
  # what can merge, so it has no checkout, no parser and no network of its own.
  #
  # `if: always()` is load-bearing. Without it the job is SKIPPED when an upstream job
  # fails, a skipped job emits no check run at all, and a required context that never
  # reports leaves the pull request permanently unmergeable.
  #
  # `skipped` counts as a pass, which is what lets job-level `if:` conditions and path
  # filtering work; `failure` and `cancelled` do not.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [build, container-smoke, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No token at all: this job only reads GitHub-controlled needs.*.result values, and
    # it is the one job that decides what can merge.
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "Upstream results: ${{ join(needs.*.result, ', ') }}"
          exit 1

  docker:
    name: Publish Image (GHCR)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/fixportal/fixportal-ci-frontend:latest
            ghcr.io/fixportal/fixportal-ci-frontend:sha-${{ github.sha }}
