name: Release

# Publish @fix-portal/ci-frontend to public npm on a version tag (e.g. v0.1.0).
#
# Published to public npm and installable tokenlessly — no GitHub Packages
# mirror, and no private scope anywhere in the dependency tree.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Full CI
    uses: ./.github/workflows/ci.yml
    # packages: write is for ci.yml's own docker job, which never runs from here —
    # it is gated on refs/heads/main. GitHub validates a called workflow's declared
    # permissions against the caller at parse time regardless of any job's `if:`, so
    # omitting it fails the whole run with startup_failure and no job log (v2.7.0).
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish Package (npm)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out backend contract
        uses: actions/checkout@v7
        with:
          repository: FixPortal/fixportal-ci-backend
          # Pinned: a release must validate against a fixed contract. Tracking the
          # backend's default-branch HEAD would let a later re-run of the same tag
          # flip the result. Bump deliberately when the contract moves.
          ref: f85a878dd8790144332063ba642cb97c1b1e94d1
          path: .contract/backend
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      # A ref gate on refs/tags/v* proves the ref's SHAPE, never that the commit was
      # reviewed. `git push origin v1.2.3` puts the tag on whatever commit you name,
      # including one that never opened a PR, and this job would then publish it to the
      # public npm registry. Rulesets target branches; a branch ruleset does not
      # constrain tags, and this repository has no tag-target ruleset. Assert
      # reachability instead: it fails closed and is visible in the diff.
      - name: Assert the tagged commit is reachable from main
        run: |
          set -euo pipefail
          # Full fetch of main, not --depth: the tag may name an older main commit, and a
          # shallow fetch leaves merge-base no shared history to walk.
          git fetch --no-tags origin main
          # PEEL the ref first. For an ANNOTATED or signed tag, GITHUB_SHA is the tag
          # OBJECT's sha, not a commit, and merge-base then fails with a confusing
          # message rather than the intended one. `^{commit}` peels a tag object and is
          # the identity for a plain commit sha, so this is correct either way.
          tagged_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          if ! git merge-base --is-ancestor "$tagged_commit" FETCH_HEAD; then
            echo "::error::Tag '${GITHUB_REF_NAME}' names a commit that is not reachable from main. Only reviewed, merged commits may be released."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Safe now that every dependency is public (same reasoning as ci.yml).
          cache: npm
          # No registry-url: publishing authenticates via OIDC trusted publishing
          # (permissions.id-token below), so setup-node must not write a token
          # auth line into .npmrc. The scoped registry is set explicitly next.

      - name: Configure registry
        run: npm config set @fix-portal:registry https://registry.npmjs.org

      - name: Install
        # No registry credentials needed — every dependency is public.
        # --ignore-scripts: no lifecycle scripts run (same reasoning as ci.yml).
        run: npm ci --ignore-scripts

      - name: Assert release tag matches package version
        run: node scripts/release-tag.mjs

      - name: Verify
        run: npm run verify

      - name: Test backend contract
        run: npm run test:backend-contract -- .contract/backend/contracts/dashboard-snapshot.v1.json

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e

      - name: Package consumer smoke
        run: npm run test:package

      - name: Production container smoke
        run: npm run test:container

      - name: Publish to public npm
        run: npm publish --provenance -w @fix-portal/ci-frontend
