name: Release

# Publish @fix-portal/ci-frontend to public npm on a version tag (e.g. v0.1.0).
#
# The package scope (@fix-portal) is distinct from @fixportal/design's scope, so
# consumers map just this scope to public npm and install it tokenlessly — no
# GitHub Packages mirror needed.

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Package (npm)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # PUBLIC repo — the private-package tarball must not enter the shared
          # npm cache (fork PRs can restore default-branch caches). Same reasoning
          # as ci.yml.
          package-manager-cache: false
          # GitHub Packages auth line for the private @fixportal/* scope — the
          # workspace-wide npm ci resolves the dashboard's @fixportal/design too.
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure registry
        run: npm config set @fix-portal:registry https://registry.npmjs.org

      - name: Install
        env:
          # PAT rather than GITHUB_TOKEN, so no per-repo package read-grant is
          # needed (same wiring as the CI workflow's Install step).
          NODE_AUTH_TOKEN: ${{ secrets.FIXPORTAL_PACKAGES_TOKEN }}
        # --ignore-scripts: no lifecycle scripts run while the packages token is
        # in the environment (same reasoning as ci.yml).
        run: npm ci --ignore-scripts

      - name: Build library
        run: npm run build:lib

      - name: Publish to public npm
        run: npm publish --provenance -w @fix-portal/ci-frontend
