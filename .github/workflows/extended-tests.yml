name: Extended tests

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

concurrency:
  group: extended-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extended-tests:
    name: Extended tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Safe now that every dependency is public (same reasoning as ci.yml).
          cache: npm

      - name: Install
        # No registry credentials needed — every dependency is public.
        run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:e2e
