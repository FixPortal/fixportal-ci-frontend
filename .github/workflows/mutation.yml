name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * 4'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  stryker-ci-frontend:
    runs-on: ubuntu-latest
    # 60, not 30. The lane grew into its old ceiling and started cancelling: the four
    # scheduled runs to 2026-08-27 took 14.7, 27.2, 26.4 and 29.3 minutes, and the fifth
    # was killed at the 30-minute mark with nothing reported. A cancelled mutation run is
    # not a slow one -- it produces no score at all, so the lane had silently stopped
    # measuring anything. Doubling the ceiling restores the headroom the 14.7-minute run
    # originally had. This is a weekly workflow on a public repository, so the runner
    # minutes are free; the only cost of the larger bound is a longer wait when Stryker
    # genuinely hangs, which is what the bound is still there to catch.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Safe now that every dependency is public (same reasoning as ci.yml).
          cache: npm

      - name: Install
        # No registry credentials needed — every dependency is public.
        # --ignore-scripts: no lifecycle scripts run (same reasoning as ci.yml).
        run: npm ci --ignore-scripts

      - name: Run Stryker
        run: npm run test:mutation -w @fix-portal/ci-frontend

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: packages/ci-frontend/reports/mutation/**
          if-no-files-found: error
