name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * 4'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  stryker-ci-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # GitHub Packages auth line for the private @fixportal/* scope — the
          # workspace-wide npm ci resolves the dashboard's @fixportal/design too.
          registry-url: 'https://npm.pkg.github.com'

      - name: Install
        env:
          # PAT rather than GITHUB_TOKEN, so no per-repo package read-grant is
          # needed (same wiring as the CI workflow's Install step).
          NODE_AUTH_TOKEN: ${{ secrets.FIXPORTAL_PACKAGES_TOKEN }}
        run: npm ci

      - name: Run Stryker
        run: npm run test:mutation -w @fix-portal/ci-frontend

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: packages/ci-frontend/reports/mutation/**
          if-no-files-found: error
