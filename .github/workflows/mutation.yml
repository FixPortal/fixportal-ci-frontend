name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '45 5 * * 4'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  stryker-ci-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Safe now that every dependency is public (same reasoning as ci.yml).
          cache: npm

      - name: Install
        # No registry credentials needed — every dependency is public.
        # --ignore-scripts: no lifecycle scripts run (same reasoning as ci.yml).
        run: npm ci --ignore-scripts

      - name: Run Stryker
        run: npm run test:mutation -w @fix-portal/ci-frontend

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-report
          path: packages/ci-frontend/reports/mutation/**
          if-no-files-found: error
