version: 2

registries:
  # @fixportal/design on GitHub Packages requires a token even to read. This is the
  # ORG-LEVEL Dependabot secret (Org settings > Secrets > Dependabot >
  # FIXPORTAL_PACKAGES_TOKEN, selected repositories) — Dependabot cannot read Actions
  # secrets. Without it the npm sweep cannot check the private scope.
  fixportal-github-packages-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.FIXPORTAL_PACKAGES_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - fixportal-github-packages-npm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      vite-toolchain:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - major
          - minor
          - patch
      npm:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 8.x peers on typescript <6.1.0; drop once it supports TS 7
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # vitest 4.1.10 regressed `.rejects.toThrow(<message>)`: the matcher cannot
      # read the rejected Error's message, so the regex form reports `got ''` and
      # the string form crashes on `undefined.indexOf`. 4.1.9 is verified unaffected
      # (it reads the message correctly), and the exact pins in
      # packages/ci-frontend/package.json currently sit there. ONLY 4.1.10 is blocked,
      # so a fixed 4.1.11+ flows in normally; drop these two entries and relax the
      # pins to a caret range once a release carrying the fix is in.
      - dependency-name: vitest
        versions:
          - 4.1.10
      - dependency-name: "@vitest/coverage-v8"
        versions:
          - 4.1.10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
